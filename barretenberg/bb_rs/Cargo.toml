[package]
name = "polybase_bb_rs"
description = "barretenberg bindings for Rust"
version = "2.0.3"
edition = "2021"
authors = ["Bartosz Nowak", "Théo Madzou"]
license-file = "README.md"

include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "cpp/**/*"
]

exclude = [
    "cpp/bb-civc-inputs.tar.gz"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0.58"
tracing = "0.1"
tracing-subscriber = "0.3"
num-bigint = "0.4"

[build-dependencies]
bindgen = "0.71.1"
cmake = "0.1.50"
